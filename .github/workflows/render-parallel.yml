name: Blender Parallel Render (20x Speed)

on:
  workflow_dispatch:
    inputs:
      blend_file:
        description: "Project file in 'Blender Project' folder (e.g. Lion.blend, Drift.blend, or AUTO)"
        required: true
        default: "AUTO"
      render_engine:
        description: "Render Engine (CYCLES for maximum quality, or AUTO for project default)"
        required: true
        default: "CYCLES"
        type: choice
        options:
          - "CYCLES"
          - "BLENDER_EEVEE"
          - "AUTO"

env:
  PYTHONUNBUFFERED: "1"

jobs:
  render-workers:
    name: Worker ${{ matrix.worker }} of 20
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - chunk: 0
            worker: 1
          - chunk: 1
            worker: 2
          - chunk: 2
            worker: 3
          - chunk: 3
            worker: 4
          - chunk: 4
            worker: 5
          - chunk: 5
            worker: 6
          - chunk: 6
            worker: 7
          - chunk: 7
            worker: 8
          - chunk: 8
            worker: 9
          - chunk: 9
            worker: 10
          - chunk: 10
            worker: 11
          - chunk: 11
            worker: 12
          - chunk: 12
            worker: 13
          - chunk: 13
            worker: 14
          - chunk: 14
            worker: 15
          - chunk: 15
            worker: 16
          - chunk: 16
            worker: 17
          - chunk: 17
            worker: 18
          - chunk: 18
            worker: 19
          - chunk: 19
            worker: 20
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing xvfb libxi6 libxxf86vm1 \
            libgl1 libglx-mesa0 libxkbcommon0 libsm6 zstd wget xz-utils || true

      - name: Install matching Blender version
        run: |
          python3 setup_blender.py "${{ github.event.inputs.blend_file }}"

      - name: Render frame chunk
        run: |
          python3 render_chunk.py \
            --chunk ${{ matrix.chunk }} \
            --total-chunks 20 \
            --blend-file "${{ github.event.inputs.blend_file }}" \
            --engine "${{ github.event.inputs.render_engine }}"

      - name: Inspect rendered chunk files
        run: |
          ls -la output/ || true

      - name: Upload chunk frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-chunk-${{ matrix.chunk }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

  assemble-mp4:
    name: Assemble Final MP4 Video
    needs: render-workers
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all rendered chunk frames
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: frames-chunk-*
          path: downloaded_chunks/
          merge-multiple: true

      - name: Inspect downloaded files
        run: |
          mkdir -p downloaded_chunks
          ls -la downloaded_chunks/ || true

      - name: Install ffmpeg
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg || true

      - name: Stitch frames to MP4
        run: |
          python3 assemble_video.py \
            downloaded_chunks \
            final_output \
            "${{ github.event.inputs.blend_file }}"

      - name: Upload to Google Drive
        continue-on-error: true
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '15BqDdaLMcOVDVeob6Xg-pQesPSeSIveY' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 upload_to_gdrive.py final_output/rendered_animation.mp4

      - name: Upload final video and frames backup
        uses: actions/upload-artifact@v4
        with:
          name: final-animation-${{ github.run_number }}
          path: final_output/
          retention-days: 90
          if-no-files-found: warn

      - name: Display Output Video Specifications
        if: always()
        run: |
          python3 summarize_video.py \
            final_output/rendered_animation.mp4 \
            "${{ github.event.inputs.blend_file }}" \
            "${{ github.event.inputs.render_engine }}"
