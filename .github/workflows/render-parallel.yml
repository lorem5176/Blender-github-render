name: Blender Parallel Render (20x Speed)

on:
  workflow_dispatch:
    inputs:
      blend_file:
        description: "Project file in 'Blender Project' folder (e.g. one.blend, two.blend, 3.blend)"
        required: true
        default: "one.blend"
      render_engine:
        description: "Render Engine (CYCLES for maximum quality, or AUTO for project default)"
        required: true
        default: "CYCLES"
        type: choice
        options:
          - "CYCLES"
          - "BLENDER_EEVEE"
          - "AUTO"

jobs:
  render-workers:
    name: Worker ${{ matrix.worker }} of 20
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - chunk: 0
            worker: 1
          - chunk: 1
            worker: 2
          - chunk: 2
            worker: 3
          - chunk: 3
            worker: 4
          - chunk: 4
            worker: 5
          - chunk: 5
            worker: 6
          - chunk: 6
            worker: 7
          - chunk: 7
            worker: 8
          - chunk: 8
            worker: 9
          - chunk: 9
            worker: 10
          - chunk: 10
            worker: 11
          - chunk: 11
            worker: 12
          - chunk: 12
            worker: 13
          - chunk: 13
            worker: 14
          - chunk: 14
            worker: 15
          - chunk: 15
            worker: 16
          - chunk: 16
            worker: 17
          - chunk: 17
            worker: 18
          - chunk: 18
            worker: 19
          - chunk: 19
            worker: 20
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing xvfb libxi6 libxxf86vm1 \
            libgl1 libglx-mesa0 libxkbcommon0 libsm6 zstd wget xz-utils || true

      - name: Install matching Blender version
        run: |
          python3 setup_blender.py "${{ github.event.inputs.blend_file }}"

      - name: Render frame chunk
        run: |
          python3 render_chunk.py \
            --chunk ${{ matrix.chunk }} \
            --total-chunks 20 \
            --blend-file "${{ github.event.inputs.blend_file }}" \
            --engine "${{ github.event.inputs.render_engine }}"

      - name: Upload chunk frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-chunk-${{ matrix.chunk }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  assemble-mp4:
    name: Assemble Final MP4 Video
    needs: render-workers
    runs-on: ubuntu-24.04
    steps:
      - name: Download all rendered chunk frames
        uses: actions/download-artifact@v4
        with:
          pattern: frames-chunk-*
          path: downloaded_chunks/
          merge-multiple: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg

      - name: Stitch frames to MP4
        run: |
          mkdir -p final_output
          FRAME_COUNT=$(find downloaded_chunks -name "frame_*" | wc -l)
          echo "Total frames collected across all 20 workers: ${FRAME_COUNT}"

          if [ "${FRAME_COUNT}" -gt 0 ]; then
            SAMPLE_FILE=$(find downloaded_chunks -name "frame_*" | head -1)
            EXT="${SAMPLE_FILE##*.}"
            echo "Detected frame format: .${EXT}"

            # Detect native project FPS
            TARGET_FPS=$(python3 -c '
            import re, subprocess, shutil
            from render_chunk import find_blend_file, detect_scene_info
            bp = find_blend_file("${{ github.event.inputs.blend_file }}")
            s, e, fps, rx, ry = detect_scene_info(bp)
            print(fps)
            ')
            echo "Encoding video at ${TARGET_FPS} fps..."

            ffmpeg -y -framerate "${TARGET_FPS}" \
              -pattern_type glob -i "downloaded_chunks/frame_*.${EXT}" \
              -c:v libx264 -pix_fmt yuv420p -crf 18 -preset medium \
              final_output/rendered_animation.mp4
          fi

          ls -lh final_output/

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-animation-${{ github.run_number }}
          path: final_output/
          retention-days: 90
          if-no-files-found: error

      - name: Display Output Video Specifications
        if: always()
        run: |
          python3 summarize_video.py \
            final_output/rendered_animation.mp4 \
            "${{ github.event.inputs.blend_file }}" \
            "${{ github.event.inputs.render_engine }}"
