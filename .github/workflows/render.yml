name: Blender Render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      blend_file:
        description: "Path to .blend file (relative to repo root)"
        required: true
        default: "scene.blend"
      render_engine:
        description: "Render engine"
        required: true
        default: "CYCLES"
        type: choice
        options:
          - CYCLES
          - BLENDER_EEVEE
      samples:
        description: "Render samples (32-64 is fast & clean with denoising; 256 for maximum quality)"
        required: true
        default: "64"
      resolution_x:
        description: "Resolution width"
        required: true
        default: "1920"
      resolution_y:
        description: "Resolution height"
        required: true
        default: "1080"
      frame_start:
        description: "Start frame (1 for beginning)"
        required: true
        default: "1"
      frame_end:
        description: "End frame (set 0 to render all frames in scene)"
        required: true
        default: "1"
      fps:
        description: "Frames per second for output MP4"
        required: true
        default: "24"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set render parameters
        id: params
        run: |
          echo "blend_file=${{ github.event.inputs.blend_file || 'scene.blend' }}" >> $GITHUB_OUTPUT
          echo "render_engine=${{ github.event.inputs.render_engine || 'CYCLES' }}" >> $GITHUB_OUTPUT
          echo "samples=${{ github.event.inputs.samples || '64' }}" >> $GITHUB_OUTPUT
          echo "resolution_x=${{ github.event.inputs.resolution_x || '1920' }}" >> $GITHUB_OUTPUT
          echo "resolution_y=${{ github.event.inputs.resolution_y || '1080' }}" >> $GITHUB_OUTPUT
          echo "frame_start=${{ github.event.inputs.frame_start || '1' }}" >> $GITHUB_OUTPUT
          echo "frame_end=${{ github.event.inputs.frame_end || '1' }}" >> $GITHUB_OUTPUT
          echo "fps=${{ github.event.inputs.fps || '24' }}" >> $GITHUB_OUTPUT

      - name: Verify blend file
        run: |
          BLEND="${{ steps.params.outputs.blend_file }}"
          echo "Checking file: ${BLEND}"
          ls -la "${BLEND}"
          file "${BLEND}"

      - name: Install system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing xvfb libxi6 libxxf86vm1 \
            libgl1 libglx-mesa0 libxkbcommon0 libsm6 zstd wget xz-utils ffmpeg || true

      - name: Install matching Blender version
        run: |
          python3 setup_blender.py "${{ steps.params.outputs.blend_file }}"

      - name: Verify Blender installation
        run: |
          blender --version

      - name: Render
        run: |
          mkdir -p output

          echo "============================================"
          echo "  Blender Render Configuration"
          echo "============================================"
          echo "  File:        ${{ steps.params.outputs.blend_file }}"
          echo "  Engine:      ${{ steps.params.outputs.render_engine }}"
          echo "  Samples:     ${{ steps.params.outputs.samples }}"
          echo "  Resolution:  ${{ steps.params.outputs.resolution_x }}x${{ steps.params.outputs.resolution_y }}"
          echo "  Frames:      ${{ steps.params.outputs.frame_start }} - ${{ steps.params.outputs.frame_end }}"
          echo "============================================"

          xvfb-run -a blender \
            --background "${{ steps.params.outputs.blend_file }}" \
            --python render_settings.py \
            -- \
            --engine "${{ steps.params.outputs.render_engine }}" \
            --samples "${{ steps.params.outputs.samples }}" \
            --resolution_x "${{ steps.params.outputs.resolution_x }}" \
            --resolution_y "${{ steps.params.outputs.resolution_y }}" \
            --frame_start "${{ steps.params.outputs.frame_start }}" \
            --frame_end "${{ steps.params.outputs.frame_end }}" \
            --output_format "PNG" \
            --output_path "//output/frame_"

      - name: Generate MP4 video
        if: always()
        run: |
          FRAME_COUNT=$(find output -name "frame_*.png" | wc -l)
          echo "Total rendered frames found: ${FRAME_COUNT}"

          if [ "${FRAME_COUNT}" -gt 0 ]; then
            echo "Assembling MP4 video with ffmpeg at ${{ steps.params.outputs.fps }} fps..."
            ffmpeg -y -framerate "${{ steps.params.outputs.fps }}" \
              -pattern_type glob -i 'output/frame_*.png' \
              -c:v libx264 -pix_fmt yuv420p -crf 18 -preset medium \
              output/rendered_animation.mp4 || true
          fi

          echo "Final files in output/:"
          ls -lh output/

      - name: Upload rendered output
        uses: actions/upload-artifact@v4
        with:
          name: blender-render-${{ github.run_number }}
          path: output/
          retention-days: 90
          if-no-files-found: error

      - name: Render summary
        if: always()
        run: |
          echo "## 🎨 Render Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`${{ steps.params.outputs.blend_file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Engine | ${{ steps.params.outputs.render_engine }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Samples | ${{ steps.params.outputs.samples }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resolution | ${{ steps.params.outputs.resolution_x }}×${{ steps.params.outputs.resolution_y }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frames | ${{ steps.params.outputs.frame_start }}–${{ steps.params.outputs.frame_end }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f output/rendered_animation.mp4 ]; then
            echo "🎬 **Animation MP4 generated successfully!**" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d output ] && [ "$(ls -A output)" ]; then
            FILE_COUNT=$(ls -1 output/ | wc -l)
            echo "✅ **${FILE_COUNT} file(s) produced.** Download the zip in **Artifacts** above." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **No output files produced.** Check logs above." >> $GITHUB_STEP_SUMMARY
          fi
